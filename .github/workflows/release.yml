name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install libsoapysdr-dev

      - name: Validate tag matches crate version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"

          if [ "$tag_version" != "$crate_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match crate version $crate_version"
            exit 1
          fi

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --workspace --features=rtlsdr,aaronia_http,soapy -- -D warnings

      - name: Run HydraSDR Clippy
        run: |
          for features in hydrasdr hydrasdr,smol hydrasdr,tokio; do
            cargo clippy --all-targets --no-default-features --features="$features" -- -D warnings
          done

      - name: Run WebUSB Clippy
        run: |
          cargo clippy --target wasm32-unknown-unknown --lib --no-default-features --features=hydrasdr -- -D warnings
          cargo clippy --manifest-path examples/webusb/Cargo.toml --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --features=aaronia_http,rtlsdr,soapy

      - name: Run HydraSDR tests
        run: |
          for features in hydrasdr hydrasdr,smol hydrasdr,tokio; do
            cargo test --all-targets --no-default-features --features="$features"
          done

      - name: Run doc tests
        run: cargo test --doc --features=aaronia_http,rtlsdr,soapy

      - name: Check public API docs
        run: cargo doc --no-deps --features=aaronia_http,rtlsdr,soapy

      - name: Check HydraSDR public API docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --no-deps --no-default-features --features=hydrasdr,smol
          cargo doc --no-deps --target wasm32-unknown-unknown --no-default-features --features=hydrasdr

      - name: Package crate
        run: cargo package

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
